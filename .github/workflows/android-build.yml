name: Build Android ARM64 Addon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Check out the Piers branch with submodules
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --------------------------------------------------
      # 2. Patch the guide URL
      # --------------------------------------------------
      - name: Patch guide URL
        run: |
          sed -i 's~https://my.hdhomerun.com~https://api.hdhomerun.com~g' src/HDHomeRunTuners.cpp
          grep -n "api.hdhomerun.com" src/HDHomeRunTuners.cpp

      # --------------------------------------------------
      # 3. Install build deps + Android NDK r26d
      # --------------------------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build cmake curl unzip pkg-config
          curl -sSL https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -o ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r26d" >> $GITHUB_ENV
          echo "$HOME/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # --------------------------------------------------
      # 4. Fetch Kodi's Android‑arm64 depends bundle
      # --------------------------------------------------
      - name: Download Kodi Android SDK
        run: |
          curl -sSL https://mirrors.kodi.tv/build-deps/android/arm64/android-aarch64-21-omega-20240225.tar.xz -o depends.tar.xz
          mkdir $HOME/kodi-sdk
          tar -xf depends.tar.xz -C $HOME/kodi-sdk --strip-components=1
          echo "KODI_DEPENDS_DIR=$HOME/kodi-sdk" >> $GITHUB_ENV

      # --------------------------------------------------
      # 5. Configure & build the addon
      # --------------------------------------------------
      - name: Build pvr.hdhomerun
        run: |
          mkdir build && cd build
          cmake .. \
            -G Ninja \
            -DADDONS_TO_BUILD=pvr.hdhomerun \
            -DADDON_SRC_PREFIX=$GITHUB_WORKSPACE \
            -DKodi_DIR=$KODI_DEPENDS_DIR/lib/cmake/Kodi \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=21 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PYTHON=OFF
          ninja
          ninja package       # ⇨ creates pvr.hdhomerun-*.zip

      # --------------------------------------------------
      # 6. Upload ZIP as artifact
      # --------------------------------------------------
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pvr-hdhomerun-android-arm64
          path: build/pvr.hdhomerun-*.zip
          retention-days: 7
