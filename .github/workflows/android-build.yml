name: Build Android ARM64 Addon

on:
  workflow_dispatch:    # allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    # Pull Kodi’s builder image **with GHCR auth**
    container:
      image: ghcr.io/xbmc/addon-builder:android-arm64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch guide URL
        # Replace my.hdhomerun.com with api.hdhomerun.com
        run: |
          sed -i 's~https://my.hdhomerun.com~https://api.hdhomerun.com~g' src/HDHomeRunTuners.cpp
          grep -n "api.hdhomerun.com" -n src/HDHomeRunTuners.cpp   # sanity check

      - name: Configure & build
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DADDONS_TO_BUILD=pvr.hdhomerun \
            -DADDON_SRC_PREFIX=$GITHUB_WORKSPACE \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PYTHON=OFF
          ninja                  # compile
          ninja package          # create ZIP

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pvr-hdhomerun-android-arm64
          path: |
            build/pvr.hdhomerun-*.zip
          retention-days: 7
