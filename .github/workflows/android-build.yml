name: Build Android ARM64 Addon

on:
  workflow_dispatch:      # lets you trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    # Public Kodi‑addon builder image on Docker Hub
    container:
      image: koiplayer/kodi-addon-builder:android-arm64
      options: --user 0         # run as root so the build can write anywhere

    steps:
      # 1. Checkout the Piers branch with submodules
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Patch the guide URL
      - name: Patch guide URL
        run: |
          sed -i 's~https://my.hdhomerun.com~https://api.hdhomerun.com~g' src/HDHomeRunTuners.cpp
          grep -n "api.hdhomerun.com" src/HDHomeRunTuners.cpp   # sanity check

      # 3. Configure, build and package just this addon
      - name: Build addon
        run: |
          mkdir build && cd build
          cmake .. \
            -DADDONS_TO_BUILD=pvr.hdhomerun \
            -DADDON_SRC_PREFIX=$GITHUB_WORKSPACE \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PYTHON=OFF
          ninja
          ninja package     # creates pvr.hdhomerun-*.zip

      # 4. Upload the resulting ZIP as an artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvr-hdhomerun-android-arm64
          path: build/pvr.hdhomerun-*.zip
          retention-days: 7
